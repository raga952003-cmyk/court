version: '3.8'

services:
  backend:
    build: ./backend
    container_name: playsmart_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ENABLE_REAL_EMAILS=${ENABLE_REAL_EMAILS:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-TCS PlaySmart}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time Vite vars — use ANON key only, never service_role
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL}}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SHOW_SIMULATED_TIME: ${VITE_SHOW_SIMULATED_TIME:-false}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: playsmart_frontend
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend
